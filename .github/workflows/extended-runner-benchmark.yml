name: Extended CI Runner Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Avrea currently injects --use-openssl-ca, which Node workers reject.
  # Clear it for both jobs so the application commands run in the same environment.
  NODE_OPTIONS: ""
  HUSKY: "0"

jobs:
  github:
    name: GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: workload

    steps:
      - name: Check out benchmark workload
        uses: actions/checkout@v5
        with:
          repository: ChiragArora31/excalidraw
          ref: 5cf547650b700b35507e83773695098150b810d2
          path: workload

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: workload/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type-check
        run: yarn test:typecheck

      - name: Run application tests
        run: yarn test:app --watch=false

      - name: Build application
        run: yarn build

  avrea:
    name: Avrea runner
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: workload

    steps:
      - name: Check out benchmark workload
        uses: actions/checkout@v5
        with:
          repository: ChiragArora31/excalidraw
          ref: 5cf547650b700b35507e83773695098150b810d2
          path: workload

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: workload/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type-check
        run: yarn test:typecheck

      - name: Run application tests
        run: yarn test:app --watch=false

      - name: Build application
        run: yarn build
