name: Docker Cache Runner Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: ""

jobs:
  github:
    name: GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out benchmark workload
        uses: actions/checkout@v5
        with:
          repository: ChiragArora31/excalidraw
          ref: 5cf547650b700b35507e83773695098150b810d2
          path: workload

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with GitHub Actions cache
        uses: docker/build-push-action@v6
        with:
          context: workload
          push: false
          cache-from: type=gha,scope=excalidraw-benchmark
          cache-to: type=gha,scope=excalidraw-benchmark,mode=max

  avrea:
    name: Avrea runner
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out benchmark workload
        uses: actions/checkout@v5
        with:
          repository: ChiragArora31/excalidraw
          ref: 5cf547650b700b35507e83773695098150b810d2
          path: workload

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Avrea colocated cache
        uses: docker/build-push-action@v6
        with:
          context: workload
          push: false
          cache-from: type=gha,url_v2=https://cache.avrea.com/,scope=excalidraw-benchmark
          cache-to: type=gha,url_v2=https://cache.avrea.com/,scope=excalidraw-benchmark,mode=max
